# g98: 每台云手机独占一对 v4l2loopback 节点，默认 0600 会让容器里的 Camera 打不开。
# systemd-tmpfiles --create 会把已存在节点的权限改回 0666（节点不存在时静默跳过）。
z /dev/video20 0666 root root -
z /dev/video21 0666 root root -
z /dev/video22 0666 root root -
z /dev/video23 0666 root root -
z /dev/video24 0666 root root -
z /dev/video25 0666 root root -
z /dev/video26 0666 root root -
z /dev/video27 0666 root root -
z /dev/video28 0666 root root -
z /dev/video29 0666 root root -
z /dev/video30 0666 root root -
z /dev/video31 0666 root root -
